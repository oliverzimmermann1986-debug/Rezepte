# ============================================================
# Rezepte - Konfiguration
# Diese Datei wird auch über das Web-Interface verwaltet.
#
# SECURITY:
#   - password: kann Klartext sein - wird beim ersten Start auto-bcrypt-gehasht.
#               Default 'changeme' verhindert den Start (siehe app/auth.py).
#               Reset jederzeit:  python -m app.cli set-password
#   - secret_key: wird beim ersten Start automatisch zufällig generiert.
#                 Manuell rotieren:  python -m app.cli rotate-secret
#   - bind_host bleibt 127.0.0.1. Externer Zugriff NUR via Reverse-Proxy/Tunnel.
# ============================================================

# Web-Interface Login
web:
  username: admin
  password: changeme
  # Nur aktivieren, wenn davor eine eigene Zugriffskontrolle wie Cloudflare
  # Access liegt. Der Logout nutzt dann /cdn-cgi/access/logout.
  auth_disabled: false
  # Optional für andere vorgeschaltete Login-Dienste. Erlaubt sind lokale
  # Pfade oder vollständige HTTPS-URLs.
  external_logout_url: ""
  bind_host: 127.0.0.1
  bind_port: 8000
  # Öffentliche Basis für widerrufbare Rezept-Links. Verhindert, dass ein
  # manipuliertes Host-Header-Ziel in einen neu erstellten Link gelangt.
  public_url: ""  # z. B. https://rezepte.example.com
  secret_key: change-this-to-random-string-32chars-min
  # Nur von diesen direkten Proxy-Adressen werden CF-Connecting-IP und
  # X-Forwarded-For für Login-Rate-Limits ausgewertet.
  trusted_proxies:
    - 127.0.0.1/32
    - "::1/128"

# Verzeichnisse - hier landen die einsortierten Videos.
# Defaults zeigen auf Container-interne Pfade. Anpassen wenn du z.B.
# einen Bind-Mount oder einen externen Cloud-Mount nutzt.
paths:
  recipe_dir: /opt/scrapper/files/rezepte
  wedding_dir: /opt/scrapper/files/hochzeit
  temp_dir: /opt/scrapper/temp
  # Mindestreserve zusätzlich zur Uploadgröße für OCR/PDF-Zwischendateien.
  upload_free_reserve_mb: 512
  logs_dir: /opt/scrapper/logs
  # Log-Files älter als N Tage werden täglich (via Timer) gelöscht.
  # 0 = nie löschen.
  log_retention_days: 30

# E-Mail Konten (2 separate Inboxes - kein Betreff-Check mehr nötig!)
mail:
  # Konto für Rezepte
  recipe:
    enabled: true
    imap_host: imap.gmail.com
    imap_port: 993
    username: rezepte@example.com
    password: app-passwort-hier
    folder: INBOX
    max_mails: 20
    attachment_max_mb: 25

  # Konto für Hochzeit
  wedding:
    enabled: true
    imap_host: imap.gmail.com
    imap_port: 993
    username: hochzeit@example.com
    password: app-passwort-hier
    folder: INBOX
    max_mails: 20
    attachment_max_mb: 25
    # Default-Kategorie wenn KI keine Zuordnung findet
    default_category: Sonstiges
    # Wenn true: ALLE Hochzeits-Items landen IMMER in Pending (kein Auto-Sortieren)
    always_pending: true

# AI Analyse - läuft über OpenAI (gpt-4o-mini per default). Bei niedriger
# Confidence landet das Item in der Pending-Liste zur manuellen Zuordnung.
# Captions in anderen Sprachen werden automatisch nach Deutsch übersetzt
# (siehe auto_translate).
ai:
  openai:
    api_key: ""               # sk-... aus platform.openai.com/api-keys
    model: gpt-4o-mini        # Empfehlung: gpt-4o-mini (günstig + ausreichend)
    # Serververwaltet: leer = api.openai.com. Interne Ziele nur als konkrete IP,
    # keine internen DNS-Namen; öffentliche HTTPS-Ziele werden DNS-gepinnt.
    base_url: ""
    timeout: 30
  # Confidence-Schwelle: darunter → Pending (manuell)
  confidence_threshold: 0.75
  description_min_length: 20
  # Auto-Übersetzung nicht-deutscher Captions ins Deutsche. Das Original
  # bleibt als description_original.txt im Rezept-Ordner erhalten.
  auto_translate: true
  # Nur bei fehlenden Zutaten oder Schritten: wenige lokale Videoframes auf
  # eingeblendeten Text prüfen, danach bei Bedarf die Audiospur transkribieren.
  # Das Video wird weder in der iPhone-App noch über eine API ausgeliefert.
  video_fallback:
    enabled: true
    max_frames: 10
    max_seconds: 600
    transcription_model: gpt-4o-mini-transcribe
    cache_filename: .video-ai-evidence.json

# PDF-Verarbeitung. Falsch gedrehte Seiten werden beim Mail-Import
# automatisch ausgerichtet. Text-PDFs werden lokal über den Text-Layer
# erkannt; gescannte Seiten optional über Tesseract OSD. Bei Unsicherheit
# wird nichts verändert. Digitale Signaturen bleiben unangetastet.
pdf:
  auto_rotate: true
  use_tesseract_osd: true
  min_text_chars: 20
  text_dominance: 0.60
  osd_min_confidence: 1.0
  max_osd_pages: 100
  # Wenn OSD bei kurzen oder bildlastigen Rezeptseiten unsicher ist, werden
  # vier Ausrichtungen lokal per OCR verglichen. Langsamer, aber robuster.
  use_ocr_vote: true
  # Konservative Scan-Aufbereitung. auto_crop verändert nur die sichtbare
  # CropBox; deskew_scans rastert nur schiefe Scan-Seiten neu und ist daher
  # bewusst standardmäßig aus. Originale werden versteckt gesichert.
  remove_blank_pages: true
  auto_crop: true
  deskew_scans: true
  # Scan-PDFs lokal per Tesseract durchsuchbar machen. Spart bei vielen
  # Anhängen zusätzliche Vision-Aufrufe und verbessert Copy/Paste.
  ocr_scans: true
  ocr_language: "deu+eng"
  # Optional: nur Scan-Seiten kontrastverstärken (rastert diese Seiten).
  improve_contrast: true
  sharpen_scans: true
  scan_dpi: 300
  keep_original: true

# yt-dlp
ytdlp:
  binary: /opt/scrapper/venv/bin/yt-dlp
  # Optionaler Cookie-Jar (Netscape-Format) für private/eingeloggte Inhalte.
  # Export via Browser-Extension "Get cookies.txt LOCALLY" o.ä.
  # Datei muss vom scrapper-User lesbar sein (chmod 600 reicht wenn owner).
  # Leer lassen wenn nur öffentliche TikToks/Instagram-Reels gescrapet werden.
  cookies_file: ""
  # TikTok zeigt lange Captions teils erst nach Klick auf "mehr". Beim
  # manuellen Re-Scrape liest ein Headless-Chromium diese gerenderte Caption.
  expanded_tiktok_caption: true
  browser_timeout_seconds: 35
  # Optional: eigener Chromium-Pfad; leer = Playwright-Browser verwenden.
  browser_executable_path: ""

# Scheduling (systemd Timer)
schedule:
  scraper_interval: "*:0/30"   # alle 30 Minuten

# Wedding-Kategorien (für KI-Vorschläge + Web-UI Dropdown)
wedding_categories:
  - Deko
  - Foto
  - Basteln
  - Einladung
  - Standesamt
  - Outfit
  - Catering
  - Sonstiges

# Recipe-Typen (für KI-Vorschläge + Web-UI Dropdown)
recipe_types:
  - Hauptgericht
  - Vorspeise
  - Nachspeise
  - Snack
  - Frühstück
  - Getränk
  - Beilage


webhooks: []

# Externe HDD mit Shelly Plug ein-/ausschalten + automatisch mounten.
# Workflow: Button im UI → Shelly an → 12s warten → mount.
# Beim Ausschalten: umount → 2s flush → Shelly aus.
#
# Sudoers-Setup nötig (einmalig):
#   cp systemd/sudoers-scrapper-hdd /etc/sudoers.d/scrapper-hdd
#   chmod 0440 /etc/sudoers.d/scrapper-hdd
# Plus fstab-Eintrag mit 'noauto,nofail' für den mount_point.
external_hdd:
  enabled: false                            # auf true für Live-Modus
  # Serververwaltet; lokale Ziele nur als konkrete IP (keine internen DNS-Namen).
  shelly_url: http://192.168.1.50           # IP deiner Shelly Plug S
  mount_point: /mnt/external_hdd            # Pfad, muss in fstab stehen
  device: /dev/sdb1                         # optional, für device_present-Check im UI
  spinup_delay_sec: 12                      # Wartezeit HDD-Spinup nach Shelly-on
  unmount_delay_sec: 2                      # FS-Flush nach umount
  http_timeout_sec: 8                       # Shelly-API-Timeout

# Verbindung zur vollwertigen Einkaufsliste. Bevorzugt wird die interne
# Adresse des zweiten Dienstes im selben Container/Netz verwendet.
einkauf:
  # Serververwaltet; http://127.0.0.1:8010 ist intern standardmäßig freigegeben.
  # Weitere interne Literal-IP-Ziele via SCRAPPER_EINKAUF_INTERNAL_URLS erlauben.
  api_url: ""                               # leer = lokaler Rezepte-Cart
  app_token: ""                             # APP_TOKEN des Einkauf-Dienstes
  cf_access_client_id: ""                   # nur bei Zugriff über Cloudflare Access
  cf_access_client_secret: ""
  auto_consolidate: true                    # nach Push /consolidate aufrufen?
