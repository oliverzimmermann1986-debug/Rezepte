# ============================================================
# Scrapper / Backup Manager - Konfiguration
# Diese Datei wird auch über das Web-Interface verwaltet.
#
# SECURITY:
#   - password: kann Klartext sein - wird beim ersten Start auto-bcrypt-gehasht.
#               Default 'changeme' verhindert den Start (siehe app/auth.py).
#               Reset jederzeit:  python -m app.cli set-password
#   - secret_key: wird beim ersten Start automatisch zufällig generiert.
#                 Manuell rotieren:  python -m app.cli rotate-secret
#   - bind_host bleibt 127.0.0.1. Externer Zugriff NUR via Reverse-Proxy/Tunnel.
# ============================================================

# Web-Interface Login
web:
  username: admin
  password: changeme
  bind_host: 127.0.0.1
  bind_port: 8000
  # IPs/CIDRs des Reverse-Proxys, dessen Forwarded-Header vertraut werden dürfen.
  # Niemals "*" eintragen. Loopback wird automatisch ergänzt.
  trusted_proxies: []
  secret_key: change-this-to-random-string-32chars-min

# Verzeichnisse - hier landen die einsortierten Videos.
# Defaults zeigen auf Container-interne Pfade. Anpassen wenn du z.B.
# einen Bind-Mount oder einen Bind-Mount nutzt.
paths:
  recipe_dir: /opt/scrapper/files/rezepte
  wedding_dir: /opt/scrapper/files/hochzeit
  temp_dir: /opt/scrapper/temp
  logs_dir: /opt/scrapper/logs
  # Log-Files älter als N Tage werden täglich (via Timer) gelöscht.
  # 0 = nie löschen.
  log_retention_days: 30

# E-Mail Konten (2 separate Inboxes - kein Betreff-Check mehr nötig!)
mail:
  # Schutz vor RAM-/Speicherüberlastung durch sehr große oder viele Anhänge.
  max_mail_mb: 50
  max_attachment_mb: 20
  max_attachments_per_mail: 10
  # Konto für Rezepte
  recipe:
    enabled: true
    imap_host: imap.gmail.com
    imap_port: 993
    username: rezepte@example.com
    password: app-passwort-hier
    folder: INBOX
    max_mails: 20

  # Konto für Hochzeit
  wedding:
    enabled: true
    imap_host: imap.gmail.com
    imap_port: 993
    username: hochzeit@example.com
    password: app-passwort-hier
    folder: INBOX
    max_mails: 20
    # Default-Kategorie wenn KI keine Zuordnung findet
    default_category: Sonstiges
    # Wenn true: ALLE Hochzeits-Items landen IMMER in Pending (kein Auto-Sortieren)
    always_pending: true

# AI Analyse - läuft nur noch über Ollama (lokal). Vision-Fallback wurde
# zusammen mit der Frame-Extraktion entfernt. Wenn Ollama unsicher ist,
# landet das Item in der Pending-Liste zur manuellen Zuordnung.
ai:
  # Provider: 'ollama' (lokal, default) oder 'openai' (Cloud)
  provider: ollama
  ollama:
    enabled: true
    url: http://192.168.178.250:11434
    # Schnelles Modell - läuft zuerst (z.B. qwen2.5:7b-instruct, llama3.1:8b)
    model: qwen2.5:7b-instruct
    # Größeres Modell als Fallback wenn fast unsicher (leer = kein Fallback)
    fallback_model: gemma4:26b
    timeout: 180
  # OpenAI als Alternative zu Ollama (Cloud-LLM, kostet ~$0.0001 pro Item).
  # Nur aktiv wenn provider: openai oben gesetzt ist.
  openai:
    api_key: ""               # sk-... aus platform.openai.com/api-keys
    model: gpt-4o-mini        # Empfehlung: gpt-4o-mini (günstig + ausreichend)
    base_url: ""              # leer = api.openai.com; gesetzt für Azure / OpenRouter / etc.
    timeout: 30
  # Confidence-Schwellen
  confidence_threshold: 0.75       # primary-Modell: darunter → fallback (nur Ollama)
  fallback_threshold: 0.5          # fallback-Modell: darunter → Pending
  description_min_length: 20

# yt-dlp
ytdlp:
  binary: /opt/scrapper/venv/bin/yt-dlp
  # Optionaler Cookie-Jar (Netscape-Format) für private/eingeloggte Inhalte.
  # Export via Browser-Extension "Get cookies.txt LOCALLY" o.ä.
  # Datei muss vom scrapper-User lesbar sein (chmod 600 reicht wenn owner).
  # Leer lassen wenn nur öffentliche TikToks/Instagram-Reels gescrapet werden.
  cookies_file: ""
  timeout_sec: 300
  max_filesize_mb: 500
  retries: 3

# Scheduling (systemd Timer)
schedule:
  scraper_interval: "*:0/30"   # alle 30 Minuten

# Wedding-Kategorien (für KI-Vorschläge + Web-UI Dropdown)
wedding_categories:
  - Deko
  - Foto
  - Basteln
  - Einladung
  - Standesamt
  - Outfit
  - Catering
  - Sonstiges

# Recipe-Typen (für KI-Vorschläge + Web-UI Dropdown)
recipe_types:
  - Hauptgericht
  - Vorspeise
  - Nachspeise
  - Snack
  - Frühstück
  - Getränk
  - Beilage

# Webhook-Notifications (optional, ersetzt frühere Telegram-Anbindung)
# Jeder Eintrag bekommt JSON-POST bei den ausgewählten Events.
# Funktioniert mit Discord-Webhooks, ntfy.sh, Slack, Teams, n8n, Home Assistant ...
#
# events: scraper_done | job_failed | pending_high
#
# webhooks:
#   - name: "Discord-Alerts"
#     url:  "https://discord.com/api/webhooks/XXX/YYY"
#     enabled: true
#     events: [scraper_done, job_failed]
#   - name: "ntfy"
#     url:  "https://ntfy.sh/scrapper-alerts"
#     enabled: true
#     events: [job_failed]
webhooks: []

# Externe HDD mit Shelly Plug ein-/ausschalten + automatisch mounten.
# Workflow: Button im UI → Shelly an → 12s warten → mount.
# Beim Ausschalten: umount → 2s flush → Shelly aus.
#
# Kein sudo für den Webdienst. Der Installer legt die root-eigene Allow-Datei
# /etc/scrapper-hdd-mountpoint an. Bei abweichendem Pfad Installer einmal mit
# SCRAPPER_HDD_MOUNT_POINT=/mnt/dein_pfad ausführen. Zusätzlich ist ein
# fstab-Eintrag mit 'noauto,nofail' für den mount_point nötig.
external_hdd:
  enabled: false                            # auf true für Live-Modus
  shelly_url: http://192.168.1.50           # IP deiner Shelly Plug S
  mount_point: /mnt/external_hdd            # Pfad, muss in fstab stehen
  device: /dev/sdb1                         # optional, für device_present-Check im UI
  spinup_delay_sec: 12                      # Wartezeit HDD-Spinup nach Shelly-on
  unmount_delay_sec: 2                      # FS-Flush nach umount
  http_timeout_sec: 8                       # Shelly-API-Timeout

# ============================================================
# Monitoring
# /metrics akzeptiert eine Web-Session oder diesen Bearer-Token.
# Der Installer ersetzt den Platzhalter bei Neuinstallationen zufällig.
# ============================================================
monitoring:
  metrics_token: change-this-metrics-token

