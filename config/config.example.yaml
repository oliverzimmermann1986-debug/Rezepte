# ============================================================
# Scrapper / Backup Manager - Konfiguration
# Diese Datei wird auch über das Web-Interface verwaltet.
#
# SECURITY:
#   - password: kann Klartext sein - wird beim ersten Start auto-bcrypt-gehasht.
#               Default 'changeme' verhindert den Start (siehe app/auth.py).
#               Reset jederzeit:  python -m app.cli set-password
#   - secret_key: wird beim ersten Start automatisch zufällig generiert.
#                 Manuell rotieren:  python -m app.cli rotate-secret
#   - bind_host bleibt 127.0.0.1. Externer Zugriff NUR via Reverse-Proxy/Tunnel.
# ============================================================

# Web-Interface Login
web:
  username: admin
  password: changeme
  bind_host: 127.0.0.1
  bind_port: 8000
  secret_key: change-this-to-random-string-32chars-min

# Verzeichnisse - hier landen die einsortierten Videos.
# Defaults zeigen auf Container-interne Pfade. Anpassen wenn du z.B.
# einen Bind-Mount oder rclone-mount nutzt.
paths:
  recipe_dir: /opt/scrapper/files/rezepte
  wedding_dir: /opt/scrapper/files/hochzeit
  temp_dir: /opt/scrapper/temp
  logs_dir: /opt/scrapper/logs

# E-Mail Konten (2 separate Inboxes - kein Betreff-Check mehr nötig!)
mail:
  # Konto für Rezepte
  recipe:
    enabled: true
    imap_host: imap.gmail.com
    imap_port: 993
    username: rezepte@example.com
    password: app-passwort-hier
    folder: INBOX
    max_mails: 20

  # Konto für Hochzeit
  wedding:
    enabled: true
    imap_host: imap.gmail.com
    imap_port: 993
    username: hochzeit@example.com
    password: app-passwort-hier
    folder: INBOX
    max_mails: 20
    # Default-Kategorie wenn KI keine Zuordnung findet
    default_category: Sonstiges
    # Wenn true: ALLE Hochzeits-Items landen IMMER in Pending (kein Auto-Sortieren)
    always_pending: true

# AI Analyse - läuft nur noch über Ollama (lokal). Vision-Fallback wurde
# zusammen mit der Frame-Extraktion entfernt. Wenn Ollama unsicher ist,
# landet das Item in der Pending-Liste zur manuellen Zuordnung.
ai:
  ollama:
    enabled: true
    url: http://192.168.178.250:11434
    # Schnelles Modell - läuft zuerst (z.B. qwen2.5:7b-instruct, llama3.1:8b)
    model: qwen2.5:7b-instruct
    # Größeres Modell als Fallback wenn fast unsicher (leer = kein Fallback)
    fallback_model: gemma4:26b
    timeout: 180
  # Confidence-Schwellen
  confidence_threshold: 0.75       # fast-Modell: darunter → fallback-Modell
  fallback_threshold: 0.5          # fallback-Modell: darunter → Pending
  description_min_length: 20

# yt-dlp
ytdlp:
  binary: /opt/scrapper/venv/bin/yt-dlp
  # Optionaler Cookie-Jar (Netscape-Format) für private/eingeloggte Inhalte.
  # Export via Browser-Extension "Get cookies.txt LOCALLY" o.ä.
  # Datei muss vom scrapper-User lesbar sein (chmod 600 reicht wenn owner).
  # Leer lassen wenn nur öffentliche TikToks/Instagram-Reels gescrapet werden.
  cookies_file: ""

# Scheduling (systemd Timer)
schedule:
  scraper_interval: "*:0/30"   # alle 30 Minuten
  backup_interval: "*-*-* 03:00:00"   # täglich 3 Uhr

# Wedding-Kategorien (für KI-Vorschläge + Web-UI Dropdown)
wedding_categories:
  - Deko
  - Foto
  - Basteln
  - Einladung
  - Standesamt
  - Outfit
  - Catering
  - Sonstiges

# Recipe-Typen (für KI-Vorschläge + Web-UI Dropdown)
recipe_types:
  - Hauptgericht
  - Vorspeise
  - Nachspeise
  - Snack
  - Frühstück
  - Getränk
  - Beilage

# ============================================================
# Backup / rclone-sync
# ============================================================
backup:
  enabled: true
  rclone_remote: pcloud
  # parallele Sync-Paare
  pairs:
    - name: Serien
      remote: pcloud:/medien/Serien
      local: /mnt/media-nas/Serien
    - name: Filme
      remote: pcloud:/medien/Filme
      local: /mnt/media-nas/Filme
    - name: Fotos
      remote: pcloud:/medien/Fotos
      local: /mnt/media-nas/Fotos
    - name: Iphone_backup
      remote: pcloud:/medien/Iphone_backup
      local: /mnt/media-nas/Iphone_backup

  rclone_args:
    # --- Performance ---
    - --fast-list                 # vorhandene Pages-API für Listings nutzen
    - --checkers=16               # parallel filechecks
    - --transfers=8               # parallel uploads
    - --use-mmap                  # memory-mapped I/O statt heap (großen Files)
    - --buffer-size=32M           # pro File-Stream Buffer (Default 16M)
    # --- Stabilität ---
    - --retries=5                 # transient errors abfedern
    - --low-level-retries=10      # für jedes einzelne API-Request
    - --retries-sleep=5s          # zwischen Versuchen warten
    - --timeout=300s              # für große Files (statt 5min default)
    - --resilient                 # bisync: weniger schnell aufgeben bei Ungereimtheiten
    - --max-lock=30m              # bisync Lock-Timeout (Default 10m war zu knapp)
    # --- Verhalten ---
    - --track-renames             # rename detection (spart re-upload)
    - --modify-window=2s          # 2s Toleranz für mtimes (Cloud uneinheitlich)
    # --- Logging ---
    - --log-level=INFO

  # Bandbreiten-Limit. Leer = unbegrenzt. Beispiele:
  #   "10M"                  - konstant 10 MByte/s
  #   "08:00,1M 22:00,off"   - tagsüber 1 MB/s, nachts unbegrenzt
  #   "Mon-08:00,1M Mon-22:00,off Fri-22:00,off"  - mehrere Zeitslots
  bwlimit: ""

  # Pfad zu einer rclone-Filter-Datei. Wird automatisch via --filter-from
  # ergänzt wenn die Datei existiert. Default-Pfad wird beim ersten Start
  # angelegt mit sinnvollen Exclusions (.DS_Store, Thumbs.db, *.tmp, ...).
  # Editierbar via Web-UI -> Einstellungen -> rclone Filter.
  filter_file: /opt/scrapper/data/rclone-filters.txt

# Webhook-Notifications (optional, ersetzt frühere Telegram-Anbindung)
# Jeder Eintrag bekommt JSON-POST bei den ausgewählten Events.
# Funktioniert mit Discord-Webhooks, ntfy.sh, Slack, Teams, n8n, Home Assistant ...
#
# events: scraper_done | backup_done | job_failed | pending_high
#
# webhooks:
#   - name: "Discord-Alerts"
#     url:  "https://discord.com/api/webhooks/XXX/YYY"
#     enabled: true
#     events: [scraper_done, backup_done, job_failed]
#   - name: "ntfy"
#     url:  "https://ntfy.sh/scrapper-alerts"
#     enabled: true
#     events: [job_failed]
webhooks: []
