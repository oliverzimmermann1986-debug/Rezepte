name: Rezepte
options:
  bundleIdPrefix: de.mausbaeren
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Rezepte:
    type: application
    platform: iOS
    sources:
      - path: Rezepte
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mausbaeren.rezepte
        PRODUCT_NAME: Rezepte
        INFOPLIST_FILE: Rezepte/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        GENERATE_INFOPLIST_FILE: false
    scheme:
      testTargets:
        - RezepteTests
  RezepteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RezepteTests
    dependencies:
      - target: Rezepte
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mausbaeren.rezepte.tests
        GENERATE_INFOPLIST_FILE: true
