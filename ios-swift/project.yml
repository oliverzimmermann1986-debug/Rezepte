name: Rezepte
options:
  bundleIdPrefix: de.mausbaeren
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Rezepte:
    type: application
    platform: iOS
    sources:
      - path: Rezepte
        excludes:
          - Resources/Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mausbaeren.rezepte
        PRODUCT_NAME: Rezepte
        INFOPLIST_FILE: Rezepte/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Rezepte/Resources/Rezepte.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "$(IOS_APP_PROFILE_NAME)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - target: RezepteShare
        embed: true
    scheme:
      testTargets:
        - RezepteTests
  RezepteShare:
    type: app-extension
    platform: iOS
    sources:
      - path: RezepteShare
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mausbaeren.rezepte.share
        PRODUCT_NAME: Rezeptregal teilen
        INFOPLIST_FILE: RezepteShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: RezepteShare/RezepteShare.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "$(IOS_SHARE_PROFILE_NAME)"
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1"
  RezepteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RezepteTests
    dependencies:
      - target: Rezepte
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mausbaeren.rezepte.tests
        GENERATE_INFOPLIST_FILE: true
