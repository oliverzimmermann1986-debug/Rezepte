name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Python syntax and undefined names
        run: |
          python -m compileall -q app tests tools video_archiver
          ruff check app tests tools video_archiver
      - name: JavaScript syntax
        run: |
          node --check app/static/runtime.js
          node --check app/static/app.js
          node --check app/static/sw.js
          for asset in app/static/features/*.js; do node --check "$asset"; done
      - name: Browser test runtime
        run: python -m playwright install --with-deps chromium
      - name: Web asynchronous regressions
        run: node --test tests/web*.test.cjs
      - name: Tests
        run: >-
          pytest -q
          --cov=app
          --cov=video_archiver
          --cov-report=term-missing
          --cov-fail-under=48
