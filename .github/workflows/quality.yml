name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: native-ios/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Browser and document system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng fonts-dejavu-core
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Complete repository verification (same plan as Proxmox)
        run: python tools/ci_verify.py
      - name: Upload gate report, test results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rezepte-quality-${{ github.sha }}
          path: |
            reports/unified-quality-report.json
            reports/ci
            .tmp/tests-*/browser
          if-no-files-found: warn
          retention-days: 7
