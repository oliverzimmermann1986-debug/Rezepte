name: Pruefdienst request

on:
  push:
    branches: ["**", "!main"]
  pull_request:

# Only metadata is sent to the existing poller. No checkout or application code
# executes here; the full Linux test plan runs in VM 110's isolated containers.
permissions:
  contents: write

jobs:
  request:
    name: Request VM 110 verification
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      PRUEFDIENST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Request exact commit through an idempotent CI tag
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const sha = process.env.PRUEFDIENST_SOURCE_SHA;
          if (!/^[a-zA-Z0-9-]+\/[a-zA-Z0-9_.-]+$/.test(repository || '') || !/^[a-f0-9]{40}$/.test(sha || '')) {
            throw new Error('Invalid repository or commit SHA');
          }
          if (!process.env.GH_TOKEN) throw new Error('GitHub token missing');
          const ref = `tags/ci/rezepte-request/${sha}`;
          const request = async (path, method = 'GET', body) => {
            const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, {
              method, redirect: 'error', signal: AbortSignal.timeout(20000),
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            if (![200, 201, 404, 422].includes(response.status)) throw new Error(`GitHub request failed (HTTP ${response.status})`);
            return { status: response.status, data: await response.json() };
          };
          const verify = response => {
            if (response.status !== 200 || response.data.object?.type !== 'commit' || response.data.object.sha !== sha) {
              throw new Error('CI tag does not reference the requested commit; refusing to move it');
            }
          };
          const existing = await request(`git/ref/${ref}`);
          if (existing.status === 404) {
            const created = await request('git/refs', 'POST', { ref: `refs/${ref}`, sha });
            if (created.status === 422) verify(await request(`git/ref/${ref}`));
            else if (created.status !== 201) throw new Error('CI tag creation failed');
            else verify({ ...created, status: 200 });
          } else verify(existing);
          console.log(`Requested VM 110 verification of ${sha}. Only pruefdienst/release is the test result.`);
          NODE
