name: Legacy Expo iPhone App

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Geprüften Expo-Build zu TestFlight hochladen"
        required: false
        default: false
        type: boolean
      assign_internal_testers:
        description: "Build zusätzlich der internen TestFlight-Gruppe zuordnen"
        required: false
        default: false
        type: boolean
      verify_build_number:
        description: "Vorhandenen TestFlight-Build bei Apple prüfen"
        required: false
        default: ""
        type: string
      verify_marketing_version:
        description: "Marketingversion des vorhandenen Builds (z. B. 1.1.0)"
        required: false
        default: ""
        type: string
# Ausschließlich workflow_dispatch-Läufe (Release/Verify): ein laufender
# TestFlight-Upload darf nie durch einen neuen Lauf abgebrochen werden.
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, lint and bundle Expo app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native-ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: native-ios/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Validate isolated development and preview variants
        shell: bash
        run: |
          set -euo pipefail
          APP_VARIANT=development npx expo config --type public >/dev/null
          APP_VARIANT=preview npx expo config --type public >/dev/null

      - name: Produce iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir dist-ci

      - name: Upload bundle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-bundle-${{ github.sha }}
          path: native-ios/dist-ci
          if-no-files-found: ignore
          retention-days: 7

  testflight:
    name: Build signed IPA locally and submit to TestFlight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_testflight }}
    needs: verify
    # Expo SDK 55 uses Swift concurrency syntax that requires Xcode 26.
    runs-on: macos-26
    timeout-minutes: 90
    environment: testflight
    defaults:
      run:
        working-directory: native-ios
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Apple App Groups are configured and verified in the Developer Portal.
      # Capability sync currently fails with ASC API-key authentication, while
      # EAS can still use the already-created remote provisioning profiles.
      EXPO_NO_CAPABILITY_SYNC: "1"
      EAS_BUILD_NO_EXPO_GO_WARNING: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: native-ios/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(EXPO_TOKEN)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing TestFlight secret: $name" >&2
              exit 1
            fi
          done
          if [[ -z "${{ secrets.ASC_PRIVATE_KEY_BASE64 }}" ]]; then
            echo "Missing App Store Connect key." >&2
            exit 1
          fi

      - name: Prepare temporary App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .eas
          echo -n "${{ secrets.ASC_PRIVATE_KEY_BASE64 }}" | base64 --decode > .eas/AuthKey_GV6ZWDDMXJ.p8
          chmod 600 .eas/AuthKey_GV6ZWDDMXJ.p8

      - name: Build signed IPA on the macOS runner
        run: >-
          npx eas-cli@22.2.0 build
          --platform ios
          --profile production
          --non-interactive
          --local
          --output ./rezepte.ipa

      - name: Resolve embedded build number
        id: submitted-build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ipa-inspect
          unzip -q rezepte.ipa -d .ipa-inspect
          app_plist="$(find .ipa-inspect/Payload -maxdepth 2 -name Info.plist -print -quit)"
          test -n "$app_plist"
          build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_plist")"
          marketing_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_plist")"
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]
          test -n "$marketing_version"
          echo "number=$build_number" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$marketing_version" >> "$GITHUB_OUTPUT"

      - name: Record App Store upload start
        id: upload-start
        shell: bash
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Submit signed IPA to App Store Connect
        run: >-
          npx eas-cli@22.2.0 submit
          --platform ios
          --profile production
          --path ./rezepte.ipa
          --non-interactive
          --wait

      - name: Verify Apple processing
        env:
          ASC_API_ISSUER_ID: "8bb7819b-3e6b-4314-a0e6-8571ed1957c0"
          ASC_API_KEY_ID: "GV6ZWDDMXJ"
          ASC_API_KEY_PATH: ".eas/AuthKey_GV6ZWDDMXJ.p8"
          ASC_APP_ID: "6803595058"
          ASC_BETA_GROUP_ID: ${{ vars.ASC_BETA_GROUP_ID || '5b41ef54-1e4f-4c3b-98e6-294d6db16233' }}
          ASC_BUILD_NUMBER: ${{ steps.submitted-build.outputs.number }}
          ASC_MARKETING_VERSION: ${{ steps.submitted-build.outputs.marketing_version }}
          ASC_UPLOAD_STARTED_AT: ${{ steps.upload-start.outputs.value }}
          ASC_ASSIGN_INTERNAL_GROUP: ${{ inputs.assign_internal_testers && 'true' || 'false' }}
        run: node scripts/testflight-ensure.mjs

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -rf .eas/AuthKey_GV6ZWDDMXJ.p8 rezepte.ipa .ipa-inspect

  verify-existing-testflight-build:
    name: Verify existing TestFlight build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_build_number != '' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: testflight
    defaults:
      run:
        working-directory: native-ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Prepare temporary App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .eas
          echo -n "${{ secrets.ASC_PRIVATE_KEY_BASE64 }}" | base64 --decode > .eas/AuthKey_GV6ZWDDMXJ.p8
          chmod 600 .eas/AuthKey_GV6ZWDDMXJ.p8

      - name: Verify Apple processing
        env:
          ASC_API_ISSUER_ID: "8bb7819b-3e6b-4314-a0e6-8571ed1957c0"
          ASC_API_KEY_ID: "GV6ZWDDMXJ"
          ASC_API_KEY_PATH: ".eas/AuthKey_GV6ZWDDMXJ.p8"
          ASC_APP_ID: "6803595058"
          ASC_BETA_GROUP_ID: ${{ vars.ASC_BETA_GROUP_ID || '5b41ef54-1e4f-4c3b-98e6-294d6db16233' }}
          ASC_BUILD_NUMBER: ${{ inputs.verify_build_number }}
          ASC_MARKETING_VERSION: ${{ inputs.verify_marketing_version }}
          ASC_ALLOW_EXISTING_BUILD: "true"
          ASC_ASSIGN_INTERNAL_GROUP: ${{ inputs.assign_internal_testers && 'true' || 'false' }}
        run: node scripts/testflight-ensure.mjs

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f .eas/AuthKey_GV6ZWDDMXJ.p8
