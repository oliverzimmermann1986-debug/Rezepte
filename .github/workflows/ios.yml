name: TypeScript iPhone App

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Geprüften Expo-Build zu TestFlight hochladen"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - "native-ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "native-ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and bundle Expo app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native-ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: native-ios/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Validate isolated development and preview variants
        shell: bash
        run: |
          set -euo pipefail
          APP_VARIANT=development npx expo config --type public >/dev/null
          APP_VARIANT=preview npx expo config --type public >/dev/null

      - name: Produce iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir dist-ci

      - name: Upload bundle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-bundle-${{ github.sha }}
          path: native-ios/dist-ci
          if-no-files-found: ignore
          retention-days: 7

  testflight:
    name: Build and submit Expo app to TestFlight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_testflight }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: testflight
    defaults:
      run:
        working-directory: native-ios
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Apple App Groups are configured and verified in the Developer Portal.
      # Capability sync currently fails with ASC API-key authentication, while
      # EAS can still use the already-created remote provisioning profiles.
      EXPO_NO_CAPABILITY_SYNC: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: native-ios/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(EXPO_TOKEN)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing TestFlight secret: $name" >&2
              exit 1
            fi
          done
          if [[ -z "${{ secrets.ASC_PRIVATE_KEY_BASE64 }}" ]]; then
            echo "Missing App Store Connect key." >&2
            exit 1
          fi

      - name: Prepare temporary App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .eas
          echo -n "${{ secrets.ASC_PRIVATE_KEY_BASE64 }}" | base64 --decode > .eas/AuthKey_GV6ZWDDMXJ.p8
          chmod 600 .eas/AuthKey_GV6ZWDDMXJ.p8

      - name: Build and submit to TestFlight
        run: npx eas-cli@22.2.0 build --platform ios --profile production --non-interactive --wait --auto-submit

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f .eas/AuthKey_GV6ZWDDMXJ.p8
