[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# Konservativer Einstieg für den gewachsenen Bestand: Syntaxfehler,
# undefinierte Namen und ungültige Kontrollflüsse blockieren CI.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
omit = ["app/static/*"]
